[project]
name = "adaptive-context"
version = "0.1.0"
description = "Adaptive context management for LLM-based Python debugging (retrieval, compression, sequencing, token budget)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
chroma = ["chromadb", "sentence-transformers"]
dev = ["pytest", "ruff"]
agent = ["langgraph>=0.2"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.scripts]
adaptive-context = "adaptive_context.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_context = ["webui/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"src/adaptive_context/protocol.py" = ["E501"]   # prompt text
"tests/test_core.py" = ["E501"]
"src/adaptive_context/bench/run.py" = ["E501", "E731"]
